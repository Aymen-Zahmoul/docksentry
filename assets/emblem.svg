<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Top Shield Cap (Thick white geometric border) -->
  <path
    d="M 32 52 L 32 38 L 60 26 L 88 38 L 88 52"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Container Cargo Blocks on Whale -->
  <!-- Bottom Row: 4 blocks -->
  <rect x="40" y="49" width="7" height="6" rx="0.5" fill="#FFFFFF"/>
  <rect x="49" y="49" width="7" height="6" rx="0.5" fill="#FFFFFF"/>
  <rect x="58" y="49" width="7" height="6" rx="0.5" fill="#FFFFFF"/>
  <rect x="67" y="49" width="7" height="6" rx="0.5" fill="#FFFFFF"/>

  <!-- Middle Row: 2 blocks on right -->
  <rect x="58" y="41" width="7" height="6" rx="0.5" fill="#FFFFFF"/>
  <rect x="67" y="41" width="7" height="6" rx="0.5" fill="#FFFFFF"/>

  <!-- Top: 1 block on far right -->
  <rect x="67" y="33" width="7" height="6" rx="0.5" fill="#FFFFFF"/>

  <!-- Whale Hull (Solid curved vessel) -->
  <path
    d="M 34 57 L 78 57 C 78 68 70 76 60 76 C 48 76 35 68 34 57 Z"
    fill="#FFFFFF"
  />

  <!-- Whale Fluke Tail -->
  <path
    d="M 76 57 C 78 54 81 50 85 47 C 83 51 83 55 86 60 C 82 58 78 58 76 57 Z"
    fill="#FFFFFF"
  />

  <!-- Shield Bottom Accent Wing/Chevron -->
  <path
    d="M 39 76 C 47 84 55 88 60 88 C 65 88 73 84 81 76"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>
